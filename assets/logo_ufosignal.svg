<?xml version="1.0" encoding="UTF-8"?>
<!-- UFOSIGNAL LOGO - ESATTA COPIA ALI DELLA FENICE STYLE -->
<!-- SFONDO BIANCO, TESTO ORO/AMBRA, CERCHIO NERO -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Gradiente oro/ambra per il testo -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A81D"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    
    <!-- Gradiente scuro per elementi -->
    <linearGradient id="darkFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C1810"/>
      <stop offset="100%" style="stop-color:#1A0F0A"/>
    </linearGradient>
    
    <!-- Filtro glow oro -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- SFONDO BIANCO/LIGHT -->
  <rect x="0" y="0" width="800" height="800" fill="#F5F5F0"/>
  
  <!-- CERCHIO NERO ESTERNO (come Ali Della Fenice) -->
  <circle cx="400" cy="400" r="360" fill="url(#darkFill)"/>
  
  <!-- CERCHIO NERO INTERNO (più scuro) -->
  <circle cx="400" cy="400" r="340" fill="#1A0F0A"/>
  
  <!-- BORDO INTERNO SOTTILE (marrone scuro) -->
  <circle cx="400" cy="400" r="335" fill="none" stroke="#3D2314" stroke-width="2"/>
  
  <!-- UFO DISCO (scuro con bordo oro) -->
  <ellipse cx="400" cy="470" rx="100" ry="30" fill="#0D0806"/>
  
  <!-- BORDO ORO UFO DISCO -->
  <ellipse cx="400" cy="470" rx="100" ry="30" fill="none" stroke="url(#goldText)" stroke-width="3"/>
  
  <!-- UFO CUPOLA (oro/ambra) -->
  <ellipse cx="400" cy="420" rx="50" ry="65" fill="url(#goldText)"/>
  
  <!-- LUCE SULLA CUPOLA -->
  <ellipse cx="400" cy="390" rx="25" ry="18" fill="#FFE4B5" opacity="0.7"/>
  
  <!-- UFO CHICCHI (3 ovali oro) -->
  <ellipse cx="355" cy="478" rx="12" ry="18" fill="url(#goldText)"/>
  <ellipse cx="400" cy="482" rx="12" ry="18" fill="url(#goldText)"/>
  <ellipse cx="445" cy="478" rx="12" ry="18" fill="url(#goldText)"/>
  
  <!-- TESTO UFO - Arco superiore sinistro (da 8 verso 6) -->
  <text fill="url(#goldText)" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="55" filter="url(#goldGlow)">
    <textPath href="#arcUFO" startOffset="2%">UFO</textPath>
  </text>
  
  <!-- TESTO SIGNAL - Arco verso il basso (da 6 verso 4) -->
  <text fill="url(#goldText)" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="55" filter="url(#goldGlow)">
    <textPath href="#arcSIGNAL" startOffset="15%">SIGNAL</textPath>
  </text>
  
  <!-- DEFINIZIONE ARCHI - POSIZIONATI VICINO AL BORDO INTERNO -->
  <!-- Arco UFO: da 8 o'clock verso 6 (semicerchio sinistro) -->
  <path id="arcUFO" d="M 170,400 A 230,230 0 0,1 400,630" fill="none"/>
  
  <!-- Arco SIGNAL: da 6 verso 4 (semicerchio destro) -->
  <path id="arcSIGNAL" d="M 400,630 A 230,230 0 0,1 630,400" fill="none"/>
</svg>
