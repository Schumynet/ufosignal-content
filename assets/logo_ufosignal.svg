<?xml version="1.0" encoding="UTF-8"?>
<!-- LOGO UFO SIGNAL - APRI QUESTO FILE IN UN BROWSER E SALVA COME PNG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cerchio nero di sfondo -->
  <circle cx="400" cy="400" r="380" fill="#18181b"/>
  
  <!-- Bordo dorato esterno con glow -->
  <circle cx="400" cy="400" r="395" fill="none" stroke="#D4A81D" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="400" r="390" fill="none" stroke="#D4A81D" stroke-width="3" opacity="0.5"/>
  <circle cx="400" cy="400" r="385" fill="none" stroke="#FFD700" stroke-width="6"/>
  
  <!-- Bordo interno -->
  <circle cx="400" cy="400" r="378" fill="none" stroke="#8B5A00" stroke-width="1" opacity="0.6"/>
  
  <!-- UFO Disco principale (scuro con bordo oro) -->
  <ellipse cx="400" cy="450" rx="95" ry="26" fill="#0f0f0f" stroke="#D4A81D" stroke-width="2"/>
  
  <!-- UFO Cupola (dorata) -->
  <ellipse cx="400" cy="412" rx="42" ry="52" fill="#D4A81D"/>
  
  <!-- UFO Chicchi (3 ovali dorati) -->
  <ellipse cx="360" cy="455" rx="10" ry="15" fill="#D4A81D"/>
  <ellipse cx="400" cy="458" rx="10" ry="15" fill="#D4A81D"/>
  <ellipse cx="440" cy="455" rx="10" ry="15" fill="#D4A81D"/>
  
  <!-- TESTO UFO curvo - Arco: da ore 8 (sinistra) verso ore 6 (basso) -->
  <text fill="#D4A81D" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" filter="url(#glow)">
    <textPath href="#arc1" startOffset="3%">UFO</textPath>
  </text>
  
  <!-- TESTO SIGNAL curvo - Arco: da ore 6 (basso) verso ore 4 (destra) -->
  <text fill="#D4A81D" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" filter="url(#glow)">
    <textPath href="#arc2" startOffset="20%">SIGNAL</textPath>
  </text>
  
  <!-- DEFINIZIONE ARCHI -->
  <!-- Arco UFO: ore 8 (150°) -> ore 6 (90°) -->
  <path id="arc1" d="M 185,400 A 215,215 0 0,1 400,615" fill="none"/>
  
  <!-- Arco SIGNAL: ore 6 (90°) -> ore 4 (30°) -->
  <path id="arc2" d="M 400,615 A 215,215 0 0,1 615,400" fill="none"/>
</svg>
