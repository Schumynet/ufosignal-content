<?xml version="1.0" encoding="UTF-8"?>
<!-- UFOSIGNAL LOGO - Stile Ali Della Fenice -->
<!-- Nero e Oro Professionale -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- CERCHIO NERO - SFONDO -->
  <circle cx="400" cy="400" r="380" fill="#0a0a0a"/>
  
  <!-- CERCHIO NERO INTERMEDIO -->
  <circle cx="400" cy="400" r="375" fill="#18181b"/>
  
  <!-- BORDO DORATO ESTERNO (multi-layer glow) -->
  <circle cx="400" cy="400" r="395" fill="none" stroke="#D4A81D" stroke-width="1" opacity="0.2"/>
  <circle cx="400" cy="400" r="390" fill="none" stroke="#D4A81D" stroke-width="2" opacity="0.4"/>
  <circle cx="400" cy="400" r="385" fill="none" stroke="#FFD700" stroke-width="4"/>
  <circle cx="400" cy="400" r="380" fill="none" stroke="#D4A81D" stroke-width="2"/>
  
  <!-- CERCHIO INTERNO SOTTILE -->
  <circle cx="400" cy="400" r="372" fill="none" stroke="#8B5A00" stroke-width="1" opacity="0.5"/>
  
  <!-- UFO DISCO PRINCIPALE (scuro) -->
  <ellipse cx="400" cy="455" rx="90" ry="25" fill="#0f0f0f"/>
  
  <!-- BORDO ORO UFO DISCO -->
  <ellipse cx="400" cy="455" rx="90" ry="25" fill="none" stroke="#D4A81D" stroke-width="2"/>
  
  <!-- UFO CUPOLA (dorata) -->
  <ellipse cx="400" cy="415" rx="40" ry="50" fill="#D4A81D"/>
  
  <!-- UFO LUCE SULLA CUPOLA -->
  <ellipse cx="400" cy="395" rx="20" ry="15" fill="#FFD700" opacity="0.6"/>
  
  <!-- UFO CHICCHI (3 ovali dorati) -->
  <ellipse cx="358" cy="460" rx="10" ry="14" fill="#D4A81D"/>
  <ellipse cx="400" cy="463" rx="10" ry="14" fill="#D4A81D"/>
  <ellipse cx="442" cy="460" rx="10" ry="14" fill="#D4A81D"/>
  
  <!-- TESTO UFO - Arco da 8 o'clock verso 6 -->
  <text fill="#D4A81D" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" filter="url(#glow)">
    <textPath href="#arcUFO" startOffset="2%">UFO</textPath>
  </text>
  
  <!-- TESTO SIGNAL - Arco da 6 verso 4 o'clock -->
  <text fill="#D4A81D" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" filter="url(#glow)">
    <textPath href="#arcSIGNAL" startOffset="18%">SIGNAL</textPath>
  </text>
  
  <!-- DEFINIZIONE ARCHI -->
  <!-- Arco UFO: ore 8 (150°) -> ore 6 (90°) -->
  <path id="arcUFO" d="M 180,400 A 220,220 0 0,1 400,620" fill="none"/>
  
  <!-- Arco SIGNAL: ore 6 (90°) -> ore 4 (30°) -->
  <path id="arcSIGNAL" d="M 400,620 A 220,220 0 0,1 620,400" fill="none"/>
</svg>
